name: Check Fizz Utrecht Availability

on:
  schedule:
    # Every 5 minutes, 04:00-17:59 UTC, Tue-Fri.
    # This window safely covers 06:00-19:00 Europe/Amsterdam time
    # across both CET (winter) and CEST (summer). The script itself
    # double-checks the exact local time and skips if outside it.
    - cron: "*/5 4-17 * * 2-5"
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run availability check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_availability.py

      - name: Save updated state
        run: |
          git config user.name "availability-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --quiet --cached; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update state.json"
          # Two checks can occasionally overlap and both try to save at
          # once. If our push gets rejected because another run saved
          # first, pull its changes in and retry, a few times if needed.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected (attempt $i), pulling latest and retrying..."
            git pull --rebase origin main
            sleep $(( (RANDOM % 5) + 1 ))
          done
          echo "Could not push after several attempts."
          exit 1
